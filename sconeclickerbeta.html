<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0"/>
  <title>Scone Clicker</title>
  <style>
  body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  overflow-y: hidden;
  font-family: Arial;
}
div {
  width:100vw;
  border: 1px solid red;
  overflow-x: hidden;
  overflow-y: hidden;
  margin:0;
  padding:0;
}
#top {
  height:90vh;
  text-align:center;
}
#main > span {
  font-size:7.5vw;
}
#cookie{
  color:white;
  position: absolute;
  width:50vw;
  height:50vw;
  left: 50%;
  top: 45%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  animation: rightroundbaby 60s linear infinite;
  transition-duration: 100ms;
}
#cookie:hover{
  width:60vw;
  height:60vw;
}
#cookie:active{
  width:50vw;
  height:50vw;
  transition-duration: 50ms;
}
#cookie_forshow{
  color:white;
  width:30vw;
  height:30vw;
}
.bear {width:67.5vw;}
.twink {width:33.5vw;}
.v7 {
  height:10vh;
  text-align:center;
}
button {
  white-space: normal;
  height:10vh;
  margin:-0.8vw;
  padding: -0.8vw;
  background-color:#3f3faf;
  color: white;
  border: 1px solid black;
  font-size:4.5vw;
  transition-duration: 200ms;
}
button:hover {
  background-color:#6f6faf;
}
button:active {
  background-color:#3f3faf;
  transition-duration: 50ms;
}
#about {
  font-size:4.5vw;
  
}
    .small {
      font-size: 3vw;
    }
@keyframes rightroundbaby {
  from {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  to {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}
</style>
</head>

<div id="top">

<div id="main">
  <span id="text_1">Scone Clicker</span><br>
  <progress id="cookie_progress" max="12"></progress><br>
<span id="text_2" style="font-size:10vw">Click to play!</span><br>
<img id="cookie" onclick="bunty();"></img><br>
<span id="text_3">0 scones/sec</span>
</div>

<div id="liszt" style="display:none;">
</div>
<div id="about" style="display:none;">
  <br>
  <goblin id="rankings">
  Reach 1,000,000 cookies as quickly as possible!
  </goblin>
  <br>
  <br>
  <img id="cookie_forshow" onclick="bunty();" src=""></img><br>
  <br>
  Thanks for playing <b>Scone Clicker</b>, a simple <br>game made as part of <b>Grandma's Scones'</b> advertising campaign.
  <br><br>
  If you enjoyed this game, feel free to drop by on <b>May 21st at lunch</b>!
  <add-to-calendar-button
  name="Get a scone from Grandma's Scones" options="'Apple','Google'" location="LDHSS" startDate="2026-05-21" endDate="2026-05-21" startTime="06:30" endTime="07:15" timeZone="EST"></add-to-calendar-button>

</div>
</div>

<div class="v7">
<button class="twink" onclick="toggle_liszt()">Buildings</button>
<button class="twink" onclick="toggle_about();">About</button>
<button class="twink" onclick="reset();">Reset</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@2" async defer></script>
<script>
cookies = 0;
cookie_rotation = 0;
timer = 0;
buildings_names = ["Unpaid Intern","LDH Student","Grandma","<span class='small'>Grandma </span>Pro Max","Kevin"];
buildings = [0,0,0,0,0];
buildings_base_prices = [1,20,400,8000,100000];
buildings_output_per = [0.5,5,40,400,4000];
ranking_times = [180, 240, 360, 480];
click_upgrades = 0;
sellmode = false;
startflag = false;
winflag = false;
top = document.getElementById("top");
pbody = document.getElementById("cookie_progress");
time_disp = document.getElementById("text_1");
cookie_disp = document.getElementById("text_2");
cookie_sec_disp = document.getElementById("text_3");
liszt = document.getElementById("liszt");
abotta = document.getElementById("about");
cookie_rotato = document.getElementById("cookie");
function bunty() {
  if (!startflag) {
    startflag = true;
    setInterval(the_rich_get_richer,50);
  }
  cookies += click_upgrade_tarot_readings();
  
  dProgressBar();
}
function toggle_liszt() {
  if (!startflag) {
    startflag = true;
    setInterval(the_rich_get_richer,50);
  }
  if (liszt.style.display == "none") {
    liszt.style.display = "block";
    update_liszt();
    return 67;
  }
  liszt.style.display = "none";
  
}
function toggle_about() {
  if (abotta.style.display == "none") {
    abotta.style.display = "block";
    top.style.overflowY = 'auto';
    return 67;
  }
  abotta.style.display = "none";
  top.style.overflowY = 'hidden';
}
function dProgressBar() {
  if (cookies >= 1) {
    pbody.value = Math.log10(cookies) + (cookies / 166667);
    
  }
  cookie_disp.innerText = Math.floor(cookies) + " Scones";
  document.title = Math.floor(cookies) + " Scones";

}
function update_liszt() {
  liszt.innerHTML = "";
  for (i=0; i<5; i++) {
    liszt.innerHTML += '<button class="bear">' + buildings_names[i] + ' x' + buildings[i] + '<span class="small"> $' + Math.floor(buildings_price_gouging(i)) + ' | ' + buildings_output_per[i] + '/s' + '</button><button class="twink" style="color: '+shop_button_color(i)+';" onclick="buildings_buy(' + i + ')">' + shop_button_text() +'</span></button>';
  }
  liszt.innerHTML += '<button class="bear" onclick="click_upgrade_buy()">Click Upgrade' + '<span class="small"> $' + Math.floor(click_upgrade_price_gouging()) + ' | ' + click_upgrade_tarot_readings() + '/s' + '</span></button><button class="twink" onclick="sellmode = !sellmode; update_liszt();">Sell Mode</button>';
  dProgressBar();
  cookie_sec_disp.innerText = Math.floor(buildings_king_calculation()) + " scones/sec";

}
function shop_button_text() {
  if (sellmode) {
    return "SELL";
  } else {
    return "BUY";
  }
}
function shop_button_color(n) {
  if (sellmode && buildings[n] > 0) {return "#ffffff";}
  if (cookies >= buildings_price_gouging(n)) {
    return "#ffffff";
  }
  return "#7f7f7f";
}
function buildings_price_gouging(n) {
  return buildings_base_prices[n] * 1.1 ** buildings[n];
}
function click_upgrade_price_gouging(n) {
  return 100 * 2 ** click_upgrades;
}
function buildings_buy(n) {
  if (sellmode && buildings[n] > 0) {
    cookies += buildings_price_gouging(n);
    buildings[n]--;
    
  } 
  else if (cookies >= buildings_price_gouging(n)) {
    cookies -= buildings_price_gouging(n);
    buildings[n]++;
  }
  update_liszt();
}
function click_upgrade_buy(n) {
  if (cookies >= click_upgrade_price_gouging()) {
    cookies -= click_upgrade_price_gouging();
    click_upgrades++;
  }
  update_liszt();
}
function buildings_king_calculation() {
  let roi = 0;
  for (i=0; i<5; i++) {
    roi += buildings[i] * buildings_output_per[i];
  }
  return roi;
}
function click_upgrade_tarot_readings(n) {
  return 1 * 2 ** click_upgrades;
}
function the_rich_get_richer() {
  for (i=0; i<5; i++) {
    cookies += buildings[i] * buildings_output_per[i]/20;
  }
  if (cookies < 1000000 && winflag == false) {
    dProgressBar();
    timer += 0.05;
    time_disp.innerText = Math.floor(timer / 60)+ ":" + (timer % 60).toFixed(2).toString().padStart(5, '0'); 
  } else {
    if (winflag == false) {
      let ranking_texts = ["<br>S (3:00)","<br>A (4:00)","<br>B (6:00)","<br>C (8:00)"];
      let ranking_temp = 0;
      liszt.style.display = "none";
      abotta.style.display = "block";
      document.getElementById("rankings").innerHTML = "Your Rank (" + time_disp.innerText.slice(0, -3)  + "):";
      for (i=0; i<4; i++) {
        if (timer > ranking_times[i]) {
          ranking_temp = i;
        }
      }
      for (i=0; i<4; i++) {
        if (i == ranking_temp) {
          document.getElementById("rankings").innerHTML += "<b>" + ranking_texts[i] + "</b>";
        } else {
          document.getElementById("rankings").innerHTML += ranking_texts[i];
        }
      }
    }
    winflag = true;
  }
  /*cookie_rotation += 1;
  cookie_rotato.style.transform = "rotate(" + cookie_rotation + "deg);";
  console.log(cookie_rotation);*/
}

function reset() {
cookies = 0;
cookie_rotation = 0;
timer = 0;
buildings = [0,0,0,0,0];
click_upgrades = 0;
sellmode = false;
winflag = false;
update_liszt();
abotta.style.display = "none";
}


</script>
