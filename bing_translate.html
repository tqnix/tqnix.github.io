function plaintoarray() {
  charcount = 0;

      oututut.push("_");

      oututut.push("*" + cookdogging[i]);

      var replacementvowel = "*";
      for (var j = i; j<cookdogging.length; j++) {
        if (cookdogging[j] == 'a' || cookdogging[j] == 'e' || cookdogging[j] == 'i' || cookdogging[j] == 'o' || cookdogging[j] == 'u') {
            replacementvowel = cookdogging[j];

    }

}
